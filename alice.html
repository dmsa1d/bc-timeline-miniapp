<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Уведомления Алисы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:12px 12px calc(20px + env(safe-area-inset-bottom)); background:var(--tg-theme-bg-color,#101c2d);color:var(--tg-theme-text-color,#f2f5fa);font-size:14px; }
    .wrap { max-width:620px;margin:auto; }
    header { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px; }
    h1 {font-size:18px;margin:0 0 3px;line-height:1.3;}
    .muted {color:var(--tg-theme-hint-color,#a7b5cc);font-size:12px;}
    .pill {font-size:11px;color:var(--tg-theme-hint-color,#a7b5cc);background:var(--tg-theme-secondary-bg-color,#1c2b42);border-radius:20px;padding:5px 9px;}
    .bulk,.profile {background:var(--tg-theme-secondary-bg-color,#1b293d);border-radius:12px;}
    .bulk {padding:11px;margin-bottom:12px;}
    .bulk-title {font-weight:700;margin-bottom:9px;}
    .buttons {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    button,select,input {font:inherit;}
    button {border:1px solid var(--tg-theme-hint-color,#7789a3);color:var(--tg-theme-text-color,#f2f5fa);background:transparent;border-radius:9px;min-height:39px;padding:6px 10px;cursor:pointer;}
    button:active {opacity:.75;}
    button.positive {border-color:var(--tg-theme-button-color,#4098ec);color:var(--tg-theme-button-color,#6cbbff);}
    button:disabled,select:disabled,input:disabled {opacity:.55;cursor:default;}
    .bulk-volume {display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .bulk-volume label {min-width:0;}
    select,input[type=text] {min-height:39px;border:1px solid var(--tg-theme-hint-color,#63738c);border-radius:9px;background:var(--tg-theme-bg-color,#111d2d);color:var(--tg-theme-text-color,#f2f5fa);padding:6px 9px;outline-offset:1px;}
    select {min-width:78px;}
    .list-title {display:flex;justify-content:space-between;margin:0 2px 8px;font-weight:700;}
    .profile {padding:10px 11px;margin-bottom:8px;}
    .head {display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;margin-bottom:7px;}
    .toggle-name {display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;}
    input[type=checkbox] {height:19px;width:19px;flex:none;margin:0;accent-color:var(--tg-theme-button-color,#4098ec);}
    .account-name {font-size:13px;font-weight:600;overflow-wrap:anywhere;}
    .onoff {color:var(--tg-theme-hint-color,#a7b5cc);font-size:11px;white-space:nowrap;}
    .settings {display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:9px;}
    .settings input {min-width:0;width:100%;}
    .settings select {width:100%;}
    .info {margin-top:11px;min-height:18px;font-size:12px;color:var(--tg-theme-hint-color,#a7b5cc);}
    .error {color:#ff8f8f;}
    @media (max-width:340px) {body {padding:9px;} .profile {padding:9px;} .settings {grid-template-columns:minmax(0,1fr) 68px;gap:6px;}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>🔊 Уведомления Алисы</h1><div class="muted" id="count">Подключение…</div></div><span class="pill">HomeServer</span></header>
    <section class="bulk" aria-label="Массовые настройки">
      <div class="bulk-title">Управление всеми</div>
      <div class="buttons"><button id="enableAll" class="positive" disabled>✓ Вкл. всех</button><button id="disableAll" disabled>✕ Выкл. всех</button></div>
      <div class="bulk-volume"><label for="allVolume">Громкость для всех</label><select id="allVolume" disabled aria-label="Громкость для всех"></select></div>
    </section>
    <div class="list-title"><span>Аккаунты</span><span class="muted">Имя · громкость 0–10</span></div>
    <div id="profiles"></div>
    <div id="info" class="info" role="status" aria-live="polite"></div>
  </main>
<script>
(() => {
  'use strict';
  const tg=window.Telegram?.WebApp;
  if(tg){try{tg.ready();tg.expand();}catch(_){}}
  const $=id=>document.getElementById(id);
  let endpoint=''; let profiles=[]; let busy=false;

  function notify(message, error=false){$('info').textContent=message;$('info').className='info'+(error?' error':'');}
  function setBusy(value){busy=value;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=value);}
  function makeVolumes(){return Array.from({length:11},(_,i)=>({value:String(i),label:String(i)}));}
  function choices(select, current){
    select.replaceChildren();
    for(const item of makeVolumes()){
      const option=document.createElement('option'); option.value=item.value;option.textContent=item.label;select.append(option);
    }
    select.value=String(current);
  }
  function populateGlobal(){
    const current=profiles.length&&profiles.every(p=>p.volume===profiles[0].volume)?String(profiles[0].volume):'';
    const select=$('allVolume'); select.replaceChildren();
    const blank=document.createElement('option');blank.value='';blank.textContent='— Разная —';blank.disabled=true;select.append(blank);
    for(const item of makeVolumes()){const o=document.createElement('option');o.value=item.value;o.textContent=item.label;select.append(o);}
    select.value=current;
  }
  async function discoverEndpoint(){
    // Timeline index.html already receives the current Cloudflare URL from the boot script.
    const response=await fetch('./index.html',{cache:'no-store'});
    if(!response.ok)throw Error('Не удалось прочитать адрес API из Timeline (HTTP '+response.status+')');
    const html=await response.text();
    const match=html.match(/\bconst\s+API_URL\s*=\s*['"](https:\/\/[^'"\s]+\/timeline)['"]/);
    if(!match)throw Error('В Timeline не найден действующий API_URL');
    const url=new URL(match[1]);
    if(url.protocol!=='https:' || url.pathname!=='/timeline')throw Error('Неверный адрес API');
    url.pathname='/alice';url.search='';url.hash='';return url.toString();
  }
  async function api(body){
    if(!tg?.initData)throw Error('Открой настройки кнопкой из Telegram-бота');
    if(!endpoint)throw Error('API ещё не подключён');
    const response=await fetch(endpoint,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData,...body}),cache:'no-store'
    });
    let data;try{data=await response.json();}catch(_){throw Error('Сервер вернул не JSON (HTTP '+response.status+')');}
    if(!response.ok||!data.ok)throw Error(data.error||'HTTP '+response.status);
    return data;
  }
  async function update(body){
    if(busy)return;
    setBusy(true);notify('Сохранение…');
    try{const data=await api(body);profiles=data.profiles;render();notify('✓ Сохранено');}
    catch(error){render();notify('Не сохранено: '+error.message,true);}
    finally{setBusy(false);}
  }
  function render(){
    $('count').textContent='Включено: '+profiles.filter(p=>p.enabled).length+' из '+profiles.length;
    populateGlobal();
    const root=$('profiles');root.replaceChildren();
    for(const p of profiles){
      const card=document.createElement('section');card.className='profile';
      const head=document.createElement('div');head.className='head';
      const label=document.createElement('label');label.className='toggle-name';
      const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=!!p.enabled;
      toggle.addEventListener('change',()=>update({action:'update',id:p.id,enabled:toggle.checked}));
      const name=document.createElement('span');name.className='account-name';name.textContent=p.name;
      label.append(toggle,name);
      const state=document.createElement('span');state.className='onoff';state.textContent=p.enabled?'Вкл.':'Выкл.';
      head.append(label,state);
      const settings=document.createElement('div');settings.className='settings';
      const alias=document.createElement('input');alias.type='text';alias.value=p.alias||'';alias.maxLength=100;alias.placeholder='Имя для Алисы';alias.setAttribute('aria-label','Имя для Алисы: '+p.name);
      alias.addEventListener('change',()=>{if(alias.value.trim()!==p.alias)update({action:'update',id:p.id,alias:alias.value});});
      alias.addEventListener('keydown',event=>{if(event.key==='Enter')alias.blur();});
      const volume=document.createElement('select');volume.setAttribute('aria-label','Громкость: '+p.name);choices(volume,p.volume);
      volume.addEventListener('change',()=>update({action:'update',id:p.id,volume:Number(volume.value)}));
      settings.append(alias,volume);
      card.append(head,settings);root.append(card);
    }
  }
  $('enableAll').addEventListener('click',()=>update({action:'bulk',enabled:true}));
  $('disableAll').addEventListener('click',()=>update({action:'bulk',enabled:false}));
  $('allVolume').addEventListener('change',e=>{if(e.target.value!=='')update({action:'bulk',volume:Number(e.target.value)});});
  async function start(){
    notify('Подключение к HomeServer…');setBusy(true);
    try{
      if(!tg?.initData)throw Error('Открой страницу из меню Telegram-бота');
      endpoint=await discoverEndpoint();
      const data=await api({action:'list'});profiles=data.profiles;render();notify('Настройки синхронизированы с HomeServer');
    }catch(error){notify(error.message,true);}
    finally{setBusy(false);}
  }
  start();
})();
</script>
</body>
</html>
