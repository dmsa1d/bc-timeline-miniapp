
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Activity Timeline</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0b141a;--surface:#17242c;--surface2:#1e2d36;--line:#33434b;--fg:#edf3f5;--muted:#9bafb9;--off:#34414a;--unknown:#18242b;--accent:#85bdf7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
    main{max-width:760px;margin:0 auto;padding:20px 14px 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    h1{font-size:24px;line-height:1.2;margin:0 0 5px;font-weight:720;letter-spacing:-.5px}
    .sub{font-size:12px;color:var(--muted)}
    .badge{border:1px solid var(--line);color:var(--muted);border-radius:100px;padding:6px 10px;font-size:11px;white-space:nowrap}
    .card{background:var(--surface);border:1px solid #263942;border-radius:16px;padding:15px;margin-bottom:14px}
    .section-head{font-size:12px;font-weight:680;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
    .periods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .periods button{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:11px 4px;cursor:pointer;font-weight:620;font-size:13px;min-height:42px}
    .periods button[aria-pressed=true]{background:#244a66;color:#d3edff;border-color:#5d93bf}
    .choices{display:flex;flex-wrap:wrap;gap:8px}
    .choice{display:inline-flex;min-width:0;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);cursor:pointer;max-width:100%;line-height:1.1}
    .choice input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex-shrink:0}
    .choice span{overflow-wrap:anywhere}
    .choice.selected{border-color:var(--account-color)}
    .choice.selected span{color:var(--account-color);font-weight:650}
    .choice.disabled{opacity:.45;cursor:not-allowed}
    .hint{margin-top:10px;font-size:12px;color:var(--muted)}
    .empty{color:var(--muted);line-height:1.65;padding:18px 4px}
    .state{border-left:3px solid #719ac1;padding:10px 12px;background:var(--surface);border-radius:8px;margin-bottom:15px;line-height:1.6}
    .state.error{border-color:#ed8796;color:#ffb5bf}
    .summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
    .stat{background:var(--surface);border-radius:10px;border:1px solid #263942;padding:10px 12px;min-width:115px;flex:1}
    .stat b{display:block;font-size:18px;margin-bottom:3px}
    .stat small{color:var(--muted)}
    .day{background:var(--surface);border:1px solid #263942;border-radius:14px;margin-bottom:11px;padding:12px 11px 14px}
    .date{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;font-size:14px}
    .date span:last-child{font-size:11px;color:var(--muted);font-weight:450}
    .axis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px;align-items:center;margin-bottom:7px}
    .axis-values{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
    .row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px;align-items:center;margin-bottom:7px;min-width:0}
    .row:last-child{margin-bottom:0}
    .name{font-size:11px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .track{height:23px;width:100%;display:block;position:relative;overflow:hidden;border:1px solid #3b4952;border-radius:5px;background:var(--unknown);cursor:crosshair;touch-action:pan-y}
    .day-gesture{touch-action:pan-y;user-select:none;-webkit-user-select:none}
    .day-gesture .axis{touch-action:pan-y}
    .date .range{font-variant-numeric:tabular-nums;text-align:right}
    .track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .segment{position:absolute;top:0;bottom:0;pointer-events:none}
    .online{z-index:2}
    .offline{background:var(--off)}
    .fullprivate{background:#1e40af;z-index:3}
    .unknown{background:repeating-linear-gradient(130deg,#263740 0px,#263740 3px,#19252c 3px,#19252c 8px)}
    .marker{position:absolute;top:0;bottom:0;width:1px;background:#ffffff10;pointer-events:none;z-index:4}
    .detail{margin:0 0 14px;padding:13px 14px;background:#203742;border:1px solid #42657a;border-radius:12px;line-height:1.7}
    .detail strong{font-size:14px}
    .detail small{color:#bfd0da}
    .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:5px 0 17px}
    .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-2px}
    .legend .unknown{border:1px solid #3b4952}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:500px){
      main{padding:25px 22px 60px}
      .axis,.row{grid-template-columns:140px minmax(0,1fr);gap:10px}
      .name{font-size:12px}
      .track{height:27px}
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Activity Timeline</h1>
      <div class="sub">Telegram Mini App · Activity Monitor</div>
    </div>
    <span class="badge" id="badge">MINI APP</span>
  </header>

  <button type="button" id="forceRefresh"
    style="width:100%;margin-bottom:14px;padding:11px;border:1px solid #5d93bf;border-radius:10px;background:#244a66;color:#d3edff;font-size:13px;font-weight:650;cursor:pointer">
    ↻ Принудительно обновить
  </button>

  <div id="message" class="state" role="status">Загрузка…</div>

  <div id="app" hidden>
    <section class="card" aria-label="Период">
      <div class="section-head">Период</div>
      <div class="periods" id="periods">
        <button type="button" data-period="1" aria-pressed="false">24 часа</button>
        <button type="button" data-period="7" aria-pressed="true">7 дней</button>
        <button type="button" data-period="14" aria-pressed="false">14 дней</button>
        <button type="button" data-period="28" aria-pressed="false">28 дней</button>
      </div>
    </section>

    <section class="card" aria-label="Выбор аккаунтов">
      <div class="section-head">Сравнение · до 3 аккаунтов</div>
      <div id="choices" class="choices"></div>
      <div class="hint" id="choiceHint">Выберите до трёх аккаунтов.</div>
    </section>

    <div id="summary" class="summary" aria-live="polite"></div>

    <div class="legend">
      <span><i class="swatch" style="background:#48b6ae"></i>ONLINE — цвет аккаунта</span>
      <span><i class="swatch" style="background:#1e40af"></i>FULLPRIVATE</span>
      <span><i class="swatch" style="background:#34414a"></i>OFFLINE</span>
      <span><i class="swatch unknown"></i>Нет истории</span>
    </div>

    <div id="detail" class="detail" hidden aria-live="polite"></div>
    <div id="days"></div>
  </div>
</main>

<script>
(() => {
  'use strict';

  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (_) {}
  }

  const $ = id => document.getElementById(id);

  $('forceRefresh').addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('v', String(Date.now()));
    window.location.replace(url.toString());
  });

  const palette = [
    '#4bc9b8','#7eaaff','#ffbd67',
    '#df8fff','#ff7b96','#a9d76b',
    '#67c8e8','#eabca4','#d4a8ff'
  ];

  const TZ = 'Asia/Almaty';
  const offset = 5 * 3600 * 1000;
  let entries = [];
  let chosen = [];
  let periodDays = 7;
  let endMs = Date.now();

  const fmt = new Intl.DateTimeFormat('ru-RU',{
    timeZone:TZ,day:'numeric',month:'long',weekday:'short'
  });

  const timeFmt = new Intl.DateTimeFormat('ru-RU',{
    timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  });

  const fullFmt = new Intl.DateTimeFormat('ru-RU',{
    timeZone:TZ,day:'2-digit',month:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  });

  const colors = new Map();

  function colorFor(s){
    if(colors.has(s))return colors.get(s);
    let n=0;
    for(const c of s)n=((n*31)+c.charCodeAt(0))>>>0;
    let candidate=palette[n%palette.length];
    let tries=0;
    while([...colors.values()].includes(candidate)&&tries<palette.length){
      candidate=palette[(n+(++tries))%palette.length];
    }
    colors.set(s,candidate);
    return candidate;
  }

  function getParam(){
    if(tg?.initDataUnsafe?.start_param)return tg.initDataUnsafe.start_param;
    const qs=new URLSearchParams(location.search);
    if(qs.has('tgWebAppStartParam'))return qs.get('tgWebAppStartParam');
    return new URLSearchParams(
      location.hash.replace(/^#/,'')
    ).get('tgWebAppStartParam');
  }

  async function unpack(p){
    if(!/^[A-Za-z0-9_-]{1,512}$/.test(p)){
      throw Error('Некорректный параметр запуска');
    }
    if(typeof DecompressionStream==='undefined'){
      throw Error('Telegram не поддерживает распаковку данных');
    }
    const str=p.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(str.padEnd(Math.ceil(str.length/4)*4,'='));
    const raw=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([raw]).stream()
      .pipeThrough(new DecompressionStream('deflate'));
    const json=await new Response(stream).text();
    if(json.length>250000)throw Error('Слишком большой объём данных');
    return JSON.parse(json);
  }

  function parse(data){
    if(!data||data.v!==1||!Number.isSafeInteger(data.t)||
       !Array.isArray(data.a)||data.a.length>100){
      throw Error('Неподдерживаемый формат истории');
    }

    const base=data.t*1000;

    return data.a.map(item=>{
      if(!Array.isArray(item)||typeof item[0]!=='string'||
         !item[0]||item[0].length>100||
         !Array.isArray(item[1])||item[1].length>10000){
        throw Error('Повреждены данные аккаунта');
      }

      const events=item[1].map(evt=>{
        if(!Array.isArray(evt)||!Number.isFinite(evt[0])||
           ![0,1].includes(evt[1])){
          throw Error('Некорректное событие');
        }
        return {
          at:base+evt[0]*60000,
          online:!!evt[1]
        };
      }).sort((a,b)=>a.at-b.at);

      return {name:item[0],events};
    });
  }

  const API_URL =
    'https://ought-survive-crowd-millions.trycloudflare.com/timeline';

  async function loadHistory(){
    if(!tg?.initData){
      throw Error('Откройте приложение через Telegram');
    }

    const response=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData}),
      cache:'no-store'
    });

    if(!response.ok){
      throw Error('API вернул HTTP '+response.status);
    }

    const data=await response.json();

    if(!Array.isArray(data.accounts)){
      throw Error('Некорректный ответ API');
    }

    return data.accounts.map(account=>({
      name:account.name,
      events:account.events.map(event=>({
        at:Date.parse(event.time),
        online:event.status==='ONLINE'
      })).sort((a,b)=>a.at-b.at),
      showEvents:(account.show_events||[]).map(event=>({
        at:Date.parse(event.time),
        mode:event.mode
      })).sort((a,b)=>a.at-b.at)
    }));
  }

  function showMessage(text,fail=false){
    $('message').textContent=text;
    $('message').className='state'+(fail?' error':'');
  }

  function paintChoices(){
    const wrap=$('choices');
    wrap.replaceChildren();

    for(const acc of entries){
      const isSelected=chosen.includes(acc.name);
      const label=document.createElement('label');

      label.className='choice'+
        (isSelected?' selected':'')+
        (!isSelected&&chosen.length>=3?' disabled':'');

      label.style.setProperty('--account-color',colorFor(acc.name));

      const cb=document.createElement('input');
      cb.type='checkbox';
      cb.checked=isSelected;
      cb.disabled=!isSelected&&chosen.length>=3;

      cb.addEventListener('change',()=>{
        if(cb.checked){
          if(chosen.length>=3)return;
          chosen.push(acc.name);
        }else{
          chosen=chosen.filter(n=>n!==acc.name);
        }
        paintChoices();
        draw();
      });

      const title=document.createElement('span');
      title.textContent=acc.name;
      label.append(cb,title);
      wrap.appendChild(label);
    }

    $('choiceHint').textContent=`Выбрано: ${chosen.length} из 3`;
  }

  function dayStart(ms){
    return Math.floor((ms+offset)/86400000)*86400000-offset;
  }

  function segmentsFor(acc,from,to){
    let status='UNKNOWN';
    const out=[];
    let cursor=from;

    for(const e of acc.events){
      if(e.at<=from){
        status=e.online?'ONLINE':'OFFLINE';
        continue;
      }
      if(e.at>=to)break;

      if(e.at>cursor){
        out.push({from:cursor,to:e.at,status});
      }
      cursor=e.at;
      status=e.online?'ONLINE':'OFFLINE';
    }

    if(cursor<to)out.push({from:cursor,to,status});
    return out;
  }

  function privateSegmentsFor(acc,from,to){
    const out=[];
    let mode=null;
    let cursor=from;

    for(const e of (acc.showEvents||[])){
      if(!Number.isFinite(e.at))continue;

      if(e.at<=from){
        mode=e.mode;
        continue;
      }
      if(e.at>=to)break;

      if(e.at>cursor&&mode==='FULLPRIVATE'){
        out.push({from:cursor,to:e.at,status:'FULLPRIVATE'});
      }

      cursor=Math.max(cursor,e.at);
      mode=e.mode;
    }

    if(cursor<to&&mode==='FULLPRIVATE'){
      out.push({from:cursor,to,status:'FULLPRIVATE'});
    }

    return out;
  }

  function duration(ms){
    const m=Math.max(0,Math.round(ms/60000));
    if(m<60)return `${m} мин`;
    const h=Math.floor(m/60);
    return `${h} ч ${m%60} мин`;
  }

  function showDetails(acc,seg){
    const d=$('detail');
    d.replaceChildren();

    const strong=document.createElement('strong');
    strong.textContent=acc.name+' · '+seg.status;
    strong.style.color=seg.status==='FULLPRIVATE'?'#1e40af':
      seg.status==='ONLINE'?colorFor(acc.name):'#e9edef';

    const br=document.createElement('br');
    const small=document.createElement('small');

    small.textContent=
      `${fullFmt.format(seg.from)} — ${fullFmt.format(seg.to)} · `+
      `${duration(seg.to-seg.from)}`;

    d.append(strong,br,small);
    d.hidden=false;
  }

  // Каждый день масштабируется независимо.
  const DAY_MS=86400000;
  const MIN_SPAN=30*60000;
  const dayViews=new Map();

  const clamp=(x,low,high)=>Math.max(low,Math.min(high,x));

  function hourLabel(ms,day){
    const minutes=Math.round((ms-day)/60000);
    return String(Math.floor(minutes/60)).padStart(2,'0')+':'+
      String(minutes%60).padStart(2,'0');
  }

  function paintDay(view){
    const {day}=view;
    const visibleEnd=view.start+view.span;
    const begin=Math.max(view.start,view.periodFrom);
    const finish=Math.min(visibleEnd,view.periodEnd,day+DAY_MS);

    // Ось времени движется вместе с полосками.
    view.ticks.replaceChildren();

    for(let i=0;i<=4;i++){
      const tick=document.createElement('span');

      tick.textContent=view.span===DAY_MS
        ?String(i*6).padStart(2,'0')
        :hourLabel(view.start+view.span*i/4,day);

      view.ticks.appendChild(tick);
    }

    const magnified=view.span<DAY_MS-1000;

    view.right.textContent=
      (view.isToday?'Сегодня':'')+
      (magnified?(view.isToday?' · ':'')+
        hourLabel(view.start,day)+'–'+hourLabel(visibleEnd,day):'');

    view.right.className='range';

    for(const item of view.items){
      const {acc,track}=item;

      track.replaceChildren();
      item.segments=begin<finish
        ?segmentsFor(acc,begin,finish):[];
      item.privateSegments=[];

      function stripe(seg,cls,color){
        const bar=document.createElement('span');
        bar.className='segment '+cls;
        bar.style.left=
          ((seg.from-view.start)/view.span*100)+'%';
        bar.style.width=
          ((seg.to-seg.from)/view.span*100)+'%';

        if(color)bar.style.background=color;
        track.appendChild(bar);
      }

      for(const seg of item.segments){
        stripe(
          seg,
          seg.status.toLowerCase(),
          seg.status==='ONLINE'?colorFor(acc.name):null
        );
      }

      // FULLPRIVATE поверх ONLINE.
      for(const priv of (begin<finish
        ?privateSegmentsFor(acc,begin,finish):[])){

        for(const online of item.segments){
          if(online.status!=='ONLINE')continue;

          const a=Math.max(priv.from,online.from);
          const b=Math.min(priv.to,online.to);

          if(b<=a)continue;

          const overlap={
            from:a,
            to:b,
            status:'FULLPRIVATE'
          };

          item.privateSegments.push(overlap);
          stripe(overlap,'fullprivate',null);
        }
      }

      for(let x=1;x<4;x++){
        const mark=document.createElement('span');
        mark.className='marker';
        mark.style.left=(x*25)+'%';
        track.appendChild(mark);
      }
    }
  }

  function scheduleDayPaint(view){
    if(view.frame)return;

    view.frame=requestAnimationFrame(()=>{
      view.frame=0;
      paintDay(view);
    });
  }

  function setWindow(view,start,span){
    view.span=clamp(span,MIN_SPAN,DAY_MS);
    view.start=clamp(
      start,
      view.day,
      view.day+DAY_MS-view.span
    );

    scheduleDayPaint(view);
  }

  function showPoint(view,item,clientX){
    const r=item.track.getBoundingClientRect();
    const fraction=clamp(
      (clientX-r.left)/Math.max(r.width,1),
      0,1
    );

    const point=view.start+fraction*view.span;

    const seg=item.privateSegments.find(
      s=>point>=s.from&&point<s.to
    )||item.segments.find(
      s=>point>=s.from&&point<s.to
    );

    if(seg)showDetails(item.acc,seg);
  }

  function installDayGestures(view){
    const area=view.gesture;
    const fingers=new Map();
    let action=null;
    let previousTap=null;

    function fraction(clientX){
      const r=view.items[0].track.getBoundingClientRect();
      return clamp(
        (clientX-r.left)/Math.max(1,r.width),
        0,1
      );
    }

    function width(){
      return Math.max(
        1,
        view.items[0].track.getBoundingClientRect().width
      );
    }

    function remainingPan(){
      if(fingers.size!==1){
        action=null;
        return;
      }

      const [id,p]=[...fingers.entries()][0];

      action={
        kind:'pan',
        id,
        atX:p.x,
        atStart:view.start,
        moved:true
      };
    }

    area.addEventListener('pointerdown',ev=>{
      if(ev.pointerType==='mouse'&&ev.button!==0)return;

      const track=ev.target.closest('.track');

      fingers.set(ev.pointerId,{
        x:ev.clientX,
        y:ev.clientY,
        originX:ev.clientX,
        originY:ev.clientY,
        track
      });

      try{
        area.setPointerCapture(ev.pointerId);
      }catch(_){}

      if(fingers.size===1){
        action={
          kind:'pan',
          id:ev.pointerId,
          atX:ev.clientX,
          atStart:view.start,
          moved:false
        };
      }else if(fingers.size===2){
        const [p,q]=[...fingers.values()];
        const middle=(p.x+q.x)/2;

        action={
          kind:'pinch',
          distance:Math.max(
            1,
            Math.hypot(p.x-q.x,p.y-q.y)
          ),
          startSpan:view.span,
          anchor:view.start+fraction(middle)*view.span
        };

        previousTap=null;
      }
    });

    area.addEventListener('pointermove',ev=>{
      const p=fingers.get(ev.pointerId);
      if(!p)return;

      p.x=ev.clientX;
      p.y=ev.clientY;

      if(action?.kind==='pinch'&&fingers.size>=2){
        const [a,b]=[...fingers.values()];

        const distance=Math.max(
          1,
          Math.hypot(a.x-b.x,a.y-b.y)
        );

        const span=clamp(
          action.startSpan*action.distance/distance,
          MIN_SPAN,
          DAY_MS
        );

        const middle=(a.x+b.x)/2;

        setWindow(
          view,
          action.anchor-fraction(middle)*span,
          span
        );
      }else if(action?.kind==='pan'&&fingers.size===1){
        const delta=p.x-action.atX;

        if(Math.abs(delta)>5||
           Math.abs(p.y-p.originY)>9){
          action.moved=true;
        }

        if(Math.abs(delta)>3){
          setWindow(
            view,
            action.atStart-delta/width()*view.span,
            view.span
          );
        }
      }
    });

    area.addEventListener('pointerup',ev=>{
      const p=fingers.get(ev.pointerId);
      if(!p)return;

      const wasSingle=
        fingers.size===1&&action?.kind==='pan';

      const tap=wasSingle&&!action.moved&&p.track;

      fingers.delete(ev.pointerId);

      if(tap){
        const now=Date.now();

        const twice=
          previousTap&&
          now-previousTap.time<360&&
          previousTap.track===p.track&&
          Math.abs(previousTap.x-ev.clientX)<35;

        if(twice){
          previousTap=null;
          setWindow(view,view.day,DAY_MS);
          $('detail').hidden=true;
        }else{
          previousTap={
            time:now,
            x:ev.clientX,
            track:p.track
          };

          const item=view.items.find(
            i=>i.track===p.track
          );

          if(item){
            showPoint(view,item,ev.clientX);
          }
        }
      }else if(action?.kind==='pinch'||action?.moved){
        previousTap=null;
      }

      remainingPan();
    });

    area.addEventListener('pointercancel',ev=>{
      fingers.delete(ev.pointerId);
      previousTap=null;
      remainingPan();
    });
  }

  function draw(){
    const from=endMs-periodDays*DAY_MS;

    const selected=chosen.map(
      n=>entries.find(e=>e.name===n)
    ).filter(Boolean);

    const days=$('days');
    days.replaceChildren();
    $('detail').hidden=true;

    const sum=$('summary');
    sum.replaceChildren();

    // Суммарное время не зависит от масштаба.
    for(const a of selected){
      const intervals=segmentsFor(a,from,endMs);
      const onlineOnly=intervals.filter(
        s=>s.status==='ONLINE'
      );

      const onlineMs=onlineOnly.reduce(
        (total,s)=>total+s.to-s.from,0
      );

      const privateMs=privateSegmentsFor(a,from,endMs)
        .reduce((total,p)=>
          total+onlineOnly.reduce(
            (subtotal,s)=>
              subtotal+Math.max(
                0,
                Math.min(p.to,s.to)-Math.max(p.from,s.from)
              ),
            0
          ),
        0);

      const stat=document.createElement('div');
      stat.className='stat';
      stat.style.borderTop=
        `3px solid ${colorFor(a.name)}`;

      const b=document.createElement('b');
      b.textContent=duration(onlineMs);
      b.style.color=colorFor(a.name);

      const sm=document.createElement('small');
      sm.textContent=a.name+' · ONLINE';

      stat.append(b,sm);

      if(a.showEvents&&a.showEvents.length){
        const pb=document.createElement('b');
        pb.textContent=duration(privateMs);
        pb.style.color='#1e40af';
        pb.style.marginTop='9px';

        const psm=document.createElement('small');
        psm.textContent=a.name+' · FULLPRIVATE';

        stat.append(pb,psm);
      }

      sum.appendChild(stat);
    }

    if(!selected.length){
      days.innerHTML=
        '<div class="empty">Выберите хотя бы один аккаунт.</div>';
      return;
    }

    let day=dayStart(endMs-1);

    while(day+DAY_MS>from){
      const isToday=day===dayStart(endMs);

      let view=dayViews.get(day);

      if(!view){
        view={
          day,
          start:day,
          span:DAY_MS,
          frame:0
        };
        dayViews.set(day,view);
      }

      view.periodFrom=from;
      view.periodEnd=endMs;
      view.isToday=isToday;
      view.start=clamp(
        view.start,
        day,
        day+DAY_MS-view.span
      );

      view.items=[];

      const container=document.createElement('section');
      container.className='day';

      const heading=document.createElement('div');
      heading.className='date';

      const left=document.createElement('span');
      left.textContent=fmt.format(day);

      const right=document.createElement('span');
      heading.append(left,right);
      container.appendChild(heading);

      const gesture=document.createElement('div');
      gesture.className='day-gesture';

      const axis=document.createElement('div');
      axis.className='axis';

      const ticks=document.createElement('div');
      ticks.className='axis-values';

      const space=document.createElement('span');
      axis.append(space,ticks);
      gesture.appendChild(axis);

      view.gesture=gesture;
      view.ticks=ticks;
      view.right=right;

      for(const acc of selected){
        const row=document.createElement('div');
        row.className='row';

        const label=document.createElement('div');
        label.className='name';
        label.textContent=acc.name;
        label.title=acc.name;
        label.style.color=colorFor(acc.name);

        const track=document.createElement('button');
        track.type='button';
        track.className='track';

        track.setAttribute(
          'aria-label',
          `История ${acc.name} за ${fmt.format(day)}. `+
          'Щипок для масштаба, свайп для перемещения, '+
          'двойное нажатие для сброса'
        );

        const item={
          acc,
          track,
          segments:[],
          privateSegments:[]
        };

        track.addEventListener('click',ev=>{
          if(ev.detail===0){
            const r=track.getBoundingClientRect();
            showPoint(
              view,
              item,
              r.left+r.width/2
            );
          }
        });

        view.items.push(item);
        row.append(label,track);
        gesture.appendChild(row);
      }

      container.appendChild(gesture);
      days.appendChild(container);

      installDayGestures(view);
      paintDay(view);

      day-=DAY_MS;
    }
  }

  for(const btn of $('periods').querySelectorAll('button')){
    btn.addEventListener('click',()=>{
      periodDays=Number(btn.dataset.period);

      for(const b of $('periods').querySelectorAll('button')){
        b.setAttribute(
          'aria-pressed',
          String(b===btn)
        );
      }

      draw();
    });
  }

  (async()=>{
    try{
      showMessage('Загружаем историю с Galaxy...');

      entries=await loadHistory();
      endMs=Date.now();
      chosen=entries.slice(0,3).map(e=>e.name);

      if(!entries.length){
        showMessage('Получена пустая история.');
        return;
      }

      for(const e of entries)colorFor(e.name);

      $('message').hidden=true;
      $('app').hidden=false;
      $('badge').textContent=`${entries.length} АКК.`;

      paintChoices();
      draw();

    }catch(err){
      showMessage('Ошибка данных: '+err.message,true);
    }
  })();
})();
</script>
</body>
</html>
