<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Activity Timeline</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0b141a;--surface:#17242c;--surface2:#1e2d36;--line:#33434b;--fg:#edf3f5;--muted:#9bafb9;--off:#34414a;--unknown:#18242b;--accent:#85bdf7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
    main{max-width:760px;margin:0 auto;padding:20px 14px 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    h1{font-size:24px;line-height:1.2;margin:0 0 5px;font-weight:720;letter-spacing:-.5px}
    .sub{font-size:12px;color:var(--muted)}
    .badge{border:1px solid var(--line);color:var(--muted);border-radius:100px;padding:6px 10px;font-size:11px;white-space:nowrap}
    .card{background:var(--surface);border:1px solid #263942;border-radius:16px;padding:15px;margin-bottom:14px}
    .section-head{font-size:12px;font-weight:680;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
    .periods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .periods button{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:11px 4px;cursor:pointer;font-weight:620;font-size:13px;min-height:42px}
    .periods button[aria-pressed=true]{background:#244a66;color:#d3edff;border-color:#5d93bf}
    .choices{display:flex;flex-wrap:wrap;gap:8px}
    .choice{display:inline-flex;min-width:0;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);cursor:pointer;max-width:100%;line-height:1.1}
    .choice input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex-shrink:0}
    .choice span{overflow-wrap:anywhere}
    .choice.selected{border-color:var(--account-color)}
    .choice.selected span{color:var(--account-color);font-weight:650}
    .choice.disabled{opacity:.45;cursor:not-allowed}
    .hint{margin-top:10px;font-size:12px;color:var(--muted)}
    .empty{color:var(--muted);line-height:1.65;padding:18px 4px}
    .state{border-left:3px solid #719ac1;padding:10px 12px;background:var(--surface);border-radius:8px;margin-bottom:15px;line-height:1.6}
    .state.error{border-color:#ed8796;color:#ffb5bf}
    .summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
    .stat{background:var(--surface);border-radius:10px;border:1px solid #263942;padding:10px 12px;min-width:115px;flex:1}
    .stat b{display:block;font-size:18px;margin-bottom:3px}.stat small{color:var(--muted)}
    .day{background:var(--surface);border:1px solid #263942;border-radius:14px;margin-bottom:11px;padding:12px 11px 14px}
    .date{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;font-size:14px}
    .date span:last-child{font-size:11px;color:var(--muted);font-weight:450}
    .axis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px;align-items:center;margin-bottom:7px}
    .axis-values{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
    .row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px;align-items:center;margin-bottom:7px;min-width:0}
    .row:last-child{margin-bottom:0}
    .name{font-size:11px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .track{height:23px;width:100%;display:block;position:relative;overflow:hidden;border:1px solid #3b4952;border-radius:5px;background:var(--unknown);cursor:crosshair;touch-action:pan-y}
    .track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .segment{position:absolute;top:0;bottom:0;pointer-events:none}
    .online{z-index:2}
    .offline{background:var(--off)}
    .fullprivate{background:#f49b47;z-index:3}
    .unknown{background:repeating-linear-gradient(130deg,#263740 0px,#263740 3px,#19252c 3px,#19252c 8px)}
    .marker{position:absolute;top:0;bottom:0;width:1px;background:#ffffff10;pointer-events:none;z-index:4}
    .detail{margin:0 0 14px;padding:13px 14px;background:#203742;border:1px solid #42657a;border-radius:12px;line-height:1.7}
    .detail strong{font-size:14px}.detail small{color:#bfd0da}
    .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:5px 0 17px}
    .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-2px}
    .legend .unknown{border:1px solid #3b4952}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:500px){main{padding:25px 22px 60px}.axis,.row{grid-template-columns:140px minmax(0,1fr);gap:10px}.name{font-size:12px}.track{height:27px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Activity Timeline</h1><div class="sub">Telegram Mini App · Activity Monitor</div></div>
    <span class="badge" id="badge">MINI APP</span>
  </header>
  <div id="message" class="state" role="status">Загрузка…</div>
  <div id="app" hidden>
    <section class="card" aria-label="Период">
      <div class="section-head">Период</div>
      <div class="periods" id="periods">
        <button type="button" data-period="1" aria-pressed="false">24 часа</button>
        <button type="button" data-period="7" aria-pressed="true">7 дней</button>
        <button type="button" data-period="14" aria-pressed="false">14 дней</button>
        <button type="button" data-period="28" aria-pressed="false">28 дней</button>
      </div>
    </section>
    <section class="card" aria-label="Выбор аккаунтов">
      <div class="section-head">Сравнение · до 3 аккаунтов</div>
      <div id="choices" class="choices"></div>
      <div class="hint" id="choiceHint">Выберите до трёх аккаунтов.</div>
    </section>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div class="legend"><span><i class="swatch" style="background:#48b6ae"></i>ONLINE — цвет аккаунта</span><span><i class="swatch" style="background:#f49b47"></i>FULLPRIVATE</span><span><i class="swatch" style="background:#34414a"></i>OFFLINE</span><span><i class="swatch unknown"></i>Нет истории</span></div>
    <div id="detail" class="detail" hidden aria-live="polite"></div>
    <div id="days"></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const tg = window.Telegram?.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
  const $ = id => document.getElementById(id);
  const palette = ['#4bc9b8','#7eaaff','#ffbd67','#df8fff','#ff7b96','#a9d76b','#67c8e8','#eabca4','#d4a8ff'];
  const TZ = 'Asia/Almaty';
  const offset = 5 * 3600 * 1000; // Для дат начиная с 2024 г. Алматы: UTC+5
  let entries = [], chosen = [], periodDays = 7, endMs = Date.now();
  const fmt = new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'numeric',month:'long',weekday:'short'});
  const timeFmt = new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const fullFmt = new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const colors = new Map();
  function colorFor(s){if(colors.has(s))return colors.get(s);let n=0;for(const c of s)n=((n*31)+c.charCodeAt(0))>>>0;let candidate=palette[n%palette.length];let tries=0;while([...colors.values()].includes(candidate)&&tries<palette.length){candidate=palette[(n+(++tries))%palette.length]}colors.set(s,candidate);return candidate;}
  function getParam(){
    if(tg?.initDataUnsafe?.start_param) return tg.initDataUnsafe.start_param;
    const qs=new URLSearchParams(location.search);
    if(qs.has('tgWebAppStartParam')) return qs.get('tgWebAppStartParam');
    return new URLSearchParams(location.hash.replace(/^#/,'')).get('tgWebAppStartParam');
  }
  async function unpack(p){
    if(!/^[A-Za-z0-9_-]{1,512}$/.test(p)) throw Error('Некорректный параметр запуска');
    if(typeof DecompressionStream==='undefined')throw Error('Telegram не поддерживает распаковку данных');
    const str=p.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(str.padEnd(Math.ceil(str.length/4)*4,'='));
    const raw=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'));
    const json=await new Response(stream).text();
    if(json.length>250000)throw Error('Слишком большой объём данных');
    return JSON.parse(json);
  }
  function parse(data){
    if(!data||data.v!==1||!Number.isSafeInteger(data.t)||!Array.isArray(data.a)||data.a.length>100)throw Error('Неподдерживаемый формат истории');
    const base=data.t*1000;
    return data.a.map(item=>{
      if(!Array.isArray(item)||typeof item[0]!=='string'||!item[0]||item[0].length>100||!Array.isArray(item[1])||item[1].length>10000)throw Error('Повреждены данные аккаунта');
      const events=item[1].map(evt=>{
        if(!Array.isArray(evt)||!Number.isFinite(evt[0])||![0,1].includes(evt[1]))throw Error('Некорректное событие');
        return {at:base+evt[0]*60000,online:!!evt[1]};
      }).sort((a,b)=>a.at-b.at);
      return {name:item[0],events};
    });
  }
  const API_URL = 'https://appliance-lawn-stripes-native.trycloudflare.com/timeline';

  async function loadHistory(){
    if(!tg?.initData) throw Error('Откройте приложение через Telegram');

    const response = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData}),
      cache:'no-store'
    });

    if(!response.ok) throw Error('API вернул HTTP '+response.status);

    const data = await response.json();

    if(!Array.isArray(data.accounts)) throw Error('Некорректный ответ API');

    return data.accounts.map(account=>({
      name:account.name,
      events:account.events.map(event=>({
        at:Date.parse(event.time),
        online:event.status==='ONLINE'
      })).sort((a,b)=>a.at-b.at),
      showEvents:(account.show_events||[]).map(event=>({
        at:Date.parse(event.time),
        mode:event.mode
      })).sort((a,b)=>a.at-b.at)
    }));
  }

  function showMessage(text,fail=false){$('message').textContent=text;$('message').className='state'+(fail?' error':'');}
  function paintChoices(){
    const wrap=$('choices');wrap.replaceChildren();
    for(const acc of entries){
      const isSelected=chosen.includes(acc.name);
      const label=document.createElement('label');label.className='choice'+(isSelected?' selected':'')+(!isSelected&&chosen.length>=3?' disabled':'');
      label.style.setProperty('--account-color',colorFor(acc.name));
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=isSelected;cb.disabled=!isSelected&&chosen.length>=3;
      cb.addEventListener('change',()=>{if(cb.checked){if(chosen.length>=3)return;chosen.push(acc.name)}else{chosen=chosen.filter(n=>n!==acc.name)}paintChoices();draw()});
      const title=document.createElement('span');title.textContent=acc.name;label.append(cb,title);wrap.appendChild(label);
    }
    $('choiceHint').textContent=`Выбрано: ${chosen.length} из 3`;
  }
  function dayStart(ms){return Math.floor((ms+offset)/86400000)*86400000-offset}
  function segmentsFor(acc,from,to){
    let status='UNKNOWN';const out=[];let cursor=from;
    for(const e of acc.events){
      if(e.at<=from){status=e.online?'ONLINE':'OFFLINE';continue}
      if(e.at>=to)break;
      if(e.at>cursor)out.push({from:cursor,to:e.at,status});
      cursor=e.at;status=e.online?'ONLINE':'OFFLINE';
    }
    if(cursor<to)out.push({from:cursor,to,status});
    return out;
  }
  function privateSegmentsFor(acc,from,to){
    const out=[];
    let mode=null,cursor=from;
    for(const e of (acc.showEvents||[])){
      if(!Number.isFinite(e.at))continue;
      if(e.at<=from){mode=e.mode;continue}
      if(e.at>=to)break;
      if(e.at>cursor&&mode==='FULLPRIVATE'){
        out.push({from:cursor,to:e.at,status:'FULLPRIVATE'});
      }
      cursor=Math.max(cursor,e.at);
      mode=e.mode;
    }
    if(cursor<to&&mode==='FULLPRIVATE'){
      out.push({from:cursor,to,status:'FULLPRIVATE'});
    }
    return out;
  }
  function duration(ms){const m=Math.max(0,Math.round(ms/60000));if(m<60)return `${m} мин`;const h=Math.floor(m/60);return `${h} ч ${m%60} мин`}
  function showDetails(acc,seg){
    const d=$('detail');d.replaceChildren();
    const strong=document.createElement('strong');strong.textContent=acc.name+' · '+seg.status;
    strong.style.color=seg.status==='FULLPRIVATE'?'#f49b47':
      seg.status==='ONLINE'?colorFor(acc.name):'#e9edef';
    const br=document.createElement('br');
    const small=document.createElement('small');small.textContent=`${fullFmt.format(seg.from)} — ${fullFmt.format(seg.to)} · ${duration(seg.to-seg.from)}`;
    d.append(strong,br,small);d.hidden=false;
  }
  function draw(){
    const from=endMs-periodDays*86400000;
    const selected=chosen.map(n=>entries.find(e=>e.name===n)).filter(Boolean);
    const days=$('days');days.replaceChildren();$('detail').hidden=true;
    const sum=$('summary');sum.replaceChildren();
    for(const a of selected){
      const intervals=segmentsFor(a,from,endMs);const onlineMs=intervals.filter(s=>s.status==='ONLINE').reduce((a,s)=>a+s.to-s.from,0);
      const stat=document.createElement('div');stat.className='stat';stat.style.borderTop=`3px solid ${colorFor(a.name)}`;
      const b=document.createElement('b');b.textContent=duration(onlineMs);b.style.color=colorFor(a.name);
      const sm=document.createElement('small');sm.textContent=a.name+' · ONLINE';stat.append(b,sm);sum.appendChild(stat);
    }
    if(!selected.length){days.innerHTML='<div class="empty">Выберите хотя бы один аккаунт.</div>';return}
    let day=dayStart(endMs-1);
    while(day+86400000>from){
      const begin=Math.max(from,day),finish=Math.min(endMs,day+86400000);
      if(finish<=begin){day-=86400000;continue}
      const container=document.createElement('section');container.className='day';
      const heading=document.createElement('div');heading.className='date';
      const left=document.createElement('span');left.textContent=fmt.format(day);
      const right=document.createElement('span');right.textContent=day===dayStart(endMs)?'Сегодня':'';
      heading.append(left,right);container.appendChild(heading);
      const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<span></span><div class="axis-values"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';
      container.appendChild(axis);
      for(const a of selected){
        const row=document.createElement('div');row.className='row';
        const label=document.createElement('div');label.className='name';label.textContent=a.name;label.title=a.name;label.style.color=colorFor(a.name);
        const track=document.createElement('button');track.type='button';track.className='track';track.setAttribute('aria-label',`История ${a.name} за ${fmt.format(day)}. Нажмите, чтобы узнать время и статус`);
        const segments=segmentsFor(a,begin,finish);
        for(const seg of segments){
          const stripe=document.createElement('span');stripe.className='segment '+seg.status.toLowerCase();
          stripe.style.left=((seg.from-day)/86400000*100)+'%';stripe.style.width=((seg.to-seg.from)/86400000*100)+'%';
          if(seg.status==='ONLINE')stripe.style.background=colorFor(a.name);
          track.appendChild(stripe);
        }
        const visiblePrivate=[];
        for(const priv of privateSegmentsFor(a,begin,finish)){
          for(const online of segments){
            if(online.status!=='ONLINE')continue;
            const from=Math.max(priv.from,online.from);
            const to=Math.min(priv.to,online.to);
            if(to<=from)continue;
            visiblePrivate.push({from,to,status:'FULLPRIVATE'});
            const stripe=document.createElement('span');
            stripe.className='segment fullprivate';
            stripe.style.left=((from-day)/86400000*100)+'%';
            stripe.style.width=((to-from)/86400000*100)+'%';
            track.appendChild(stripe);
          }
        }
        for(let x=1;x<4;x++){const mark=document.createElement('span');mark.className='marker';mark.style.left=(x*25)+'%';track.appendChild(mark)}
        track.addEventListener('click',ev=>{
          const rect=track.getBoundingClientRect();
          let pos=ev.detail===0?.5:Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
          if(!Number.isFinite(pos))pos=.5;
          const point=day+pos*86400000;
          const found=visiblePrivate.find(s=>point>=s.from&&point<s.to)
            ||segments.find(s=>point>=s.from&&point<s.to)
            ||segments.at(-1);
          if(found)showDetails(a,found);
        });
        row.append(label,track);container.appendChild(row);
      }
      days.appendChild(container);day-=86400000;
    }
  }
  for(const btn of $('periods').querySelectorAll('button')){
    btn.addEventListener('click',()=>{periodDays=Number(btn.dataset.period);for(const b of $('periods').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===btn));draw()});
  }
  (async()=>{
    try{
      showMessage('Загружаем историю с Galaxy...');
      entries=await loadHistory();endMs=Date.now();
      chosen=entries.slice(0,3).map(e=>e.name);
      if(!entries.length){showMessage('Получена пустая история.');return}
      for(const e of entries)colorFor(e.name);
      $('message').hidden=true;$('app').hidden=false;$('badge').textContent=`${entries.length} АКК.`;
      paintChoices();draw();
    }catch(err){showMessage('Ошибка данных: '+err.message,true)}
  })();
})();
</script>
</body>
</html>
